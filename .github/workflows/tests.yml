name: Hermie checks
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Dashboard bundle is up to date
        run: python tools/build_dashboard.py --check
      - name: Check JavaScript syntax
        run: node --check web/hermie-view.js && node --check web/app.js && node --check dashboard/dist/index.js
      - name: Compile Python
        run: python -m compileall -q hermie.py hermie_plugin.py hermie_cli.py hermie_web.py dashboard tools
